# Postgres for local development, and Kokoro for cook mode's voice:
# `npm run db:up` / `npm run db:down`. Matches .env.example.

name: mise-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: mise
      POSTGRES_DB: mise
    ports:
      - "5432:5432"
    volumes:
      - mise-dev-db:/var/lib/postgresql

  # Cook mode's read-aloud voice, at KOKORO_URL=http://localhost:8880.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"

volumes:
  mise-dev-db:
