<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fdfaf4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mise" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Mise</title>
    <script>
      // Apply the saved mode and palette before first paint (see theme-provider.tsx).
      ;(function () {
        try {
          var mode = localStorage.getItem("mise-mode") || "system"
          var palette = localStorage.getItem("mise-palette")
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches)
          var root = document.documentElement
          if (dark) root.classList.add("dark")
          if (palette) root.dataset.palette = palette
          root.style.colorScheme = dark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
