# Nourvio: the app, Postgres, and nightly database backups.
#
# The app builds straight from GitHub, so this file plus a .env file is all a
# server needs. Works in Dockge, Portainer or plain `docker compose up -d`.
# Settings, data folders and updating are explained in README.md.

services:
  mise:
    build:
      # A branch, tag or commit: ...mise.git#main, ...mise.git#v0.1.0
      # Set MISE_BUILD_CONTEXT=. to build from a local checkout instead.
      context: ${MISE_BUILD_CONTEXT:-https://github.com/Nourvio/nourvio.git#main}
    image: mise:latest
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATABASE_URL: postgres://mise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mise
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MISE_SECRET: ${MISE_SECRET:-}
      YTDLP_AUTO_UPDATE: ${YTDLP_AUTO_UPDATE:-true}
      USDA_API_KEY: ${USDA_API_KEY:-}
      KROGER_CLIENT_ID: ${KROGER_CLIENT_ID:-}
      KROGER_CLIENT_SECRET: ${KROGER_CLIENT_SECRET:-}
      # The kokoro service below. Leave empty to not use it.
      KOKORO_URL: ${KOKORO_URL-http://kokoro:8880}
      # Where the image is built from, so Nourvio can tell when there's an update.
      MISE_BUILD_CONTEXT: ${MISE_BUILD_CONTEXT:-https://github.com/Nourvio/nourvio.git#main}
    ports:
      - "${MISE_PORT:-3000}:3000"
    volumes:
      - ./data/app:/data

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: mise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mise
      TZ: ${TZ:-UTC}
    volumes:
      # Postgres 18 and newer keep data under /var/lib/postgresql, not .../data.
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mise -d mise"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published ports: only the app can reach the database.

  db-backup:
    image: postgres:18 # same version as db, so pg_dump matches the server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: mise
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: mise
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/backups/mise-$$(date +%F).dump"
          pg_dump -Fc -f "$$file" && echo "Saved $$file"
          find /backups -name 'mise-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

  # Reads recipe steps aloud in hands-free cook mode, in a natural voice
  # (Kokoro, an open voice model). Free, and nothing leaves your server.
  # Settings → This server → Voice picks it, OpenAI, or each device's own.
  # It needs about 1-2 GB of disk and RAM. Not wanted? Delete this service and
  # set KOKORO_URL= (empty) in .env.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    # No published ports: only Nourvio talks to it.

  # Optional: a Cloudflare Tunnel, for reaching Nourvio from outside your network.
  # Set TUNNEL_TOKEN in .env, then delete the `profiles` line below
  # (or run `docker compose --profile tunnel up -d`).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - mise
